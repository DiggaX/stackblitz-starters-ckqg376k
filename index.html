<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#15803d" />
<title>⚽ Turniergenerator</title>
<style>
  :root {
    --green: #15803d;
    --green-dark: #166534;
    --green-light: #22c55e;
    --bg: #f1f5f4;
    --card: #ffffff;
    --text: #14231c;
    --muted: #6b7c73;
    --line: #e2e8e5;
    --gold: #f5b301;
    --silver: #9aa7b0;
    --bronze: #cd7f32;
    --danger: #dc2626;
    --shadow: 0 2px 10px rgba(20,50,35,.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 48px; }

  header.top {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    color: #fff;
    padding: 18px 16px;
    text-align: center;
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 10;
  }
  header.top h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
  header.top .sub { font-size: 13px; opacity: .9; margin-top: 2px; min-height: 16px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 16px;
    margin-top: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .card h2 .hint { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted); }

  label.fld { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  input[type="text"], input[type="number"] {
    font-family: inherit; font-size: 16px; color: var(--text);
    border: 1.5px solid var(--line); border-radius: 10px;
    padding: 11px 12px; width: 100%; background: #fff;
  }
  input:focus { outline: none; border-color: var(--green-light); }

  .row { display: flex; gap: 8px; align-items: center; }
  .team-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .team-row .idx {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    background: var(--green); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .team-row input { flex: 1; }

  button {
    font-family: inherit; font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; padding: 12px 14px;
    cursor: pointer; transition: transform .05s ease, filter .15s ease;
  }
  button:active { transform: scale(.97); }
  .btn-primary { background: var(--green); color: #fff; width: 100%; }
  .btn-primary:disabled { background: #a7c3b2; cursor: not-allowed; }
  .btn-secondary { background: #eef2f0; color: var(--text); }
  .btn-danger { background: #fdecec; color: var(--danger); }
  .btn-ghost { background: transparent; color: var(--green); padding: 8px 6px; }
  .icon-btn {
    flex: 0 0 40px; width: 40px; height: 40px; padding: 0; font-size: 18px;
    background: #fdecec; color: var(--danger); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-add { flex: 0 0 auto; background: var(--green); color: #fff; padding: 11px 16px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions > * { flex: 1; }
  .spacer { height: 6px; }

  /* Spielplan */
  .matchday-title {
    font-size: 13px; font-weight: 700; color: var(--green-dark);
    text-transform: uppercase; letter-spacing: .5px;
    margin: 18px 0 8px; padding-left: 2px;
  }
  .match {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 6px; padding: 10px 8px; border-bottom: 1px solid var(--line);
  }
  .match:last-child { border-bottom: none; }
  .match .tname { font-size: 14px; font-weight: 600; }
  .match .home { text-align: right; }
  .match .away { text-align: left; }
  .match .score { display: flex; align-items: center; gap: 6px; }
  .match .score input {
    width: 46px; text-align: center; padding: 9px 4px; font-weight: 700; font-size: 17px;
  }
  .match .colon { font-weight: 700; color: var(--muted); }
  .score input.win { border-color: var(--green-light); background: #f0fdf4; color: var(--green-dark); }

  /* Tabelle */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.standings { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.standings th, table.standings td { padding: 9px 6px; text-align: center; white-space: nowrap; }
  table.standings th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; border-bottom: 2px solid var(--line); font-weight: 700; }
  table.standings td { border-bottom: 1px solid var(--line); }
  table.standings .team-cell { text-align: left; font-weight: 600; }
  table.standings .rank { font-weight: 700; color: var(--muted); width: 26px; }
  table.standings .pts { font-weight: 800; color: var(--green-dark); }
  table.standings tr.r1 .team-cell { color: var(--green-dark); }
  table.standings tr.r1 td { background: #f0fdf4; }
  table.standings tr.r2 td { background: #f8fafc; }
  table.standings tr.r3 td { background: #fdf6ec; }

  /* Podium / Abschluss */
  .champion {
    text-align: center; background: linear-gradient(135deg, #fff7e0, #ffe9b3);
    border: 2px solid var(--gold); border-radius: 16px; padding: 20px; margin-top: 4px;
  }
  .champion .cup { font-size: 46px; }
  .champion .label { font-size: 13px; color: #8a6d1a; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .champion .name { font-size: 24px; font-weight: 800; color: #7a5a00; margin-top: 2px; }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin: 18px 0 4px; }
  .podium .spot { flex: 1; max-width: 120px; text-align: center; }
  .podium .medal { font-size: 30px; }
  .podium .pteam { font-weight: 700; font-size: 14px; margin-top: 2px; word-break: break-word; }
  .podium .bar { border-radius: 10px 10px 0 0; margin-top: 6px; color: #fff; font-weight: 800; font-size: 18px; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
  .podium .p1 .bar { background: var(--gold); height: 76px; }
  .podium .p2 .bar { background: var(--silver); height: 56px; }
  .podium .p3 .bar { background: var(--bronze); height: 40px; }

  .note { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 10px 0; }
  .badge { display:inline-block; background:#eef2f0; color:var(--muted); font-size:12px; font-weight:700; border-radius:20px; padding:3px 10px; }
  footer.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }

  /* Eigenes Bestätigungsfenster (statt window.confirm, das in manchen In-App-Browsern blockiert ist) */
  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 30, 22, .55);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 100;
  }
  .modal {
    background: #fff; border-radius: 16px; padding: 20px;
    width: 100%; max-width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  .modal-msg { font-size: 15px; white-space: pre-line; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions > button { flex: 1; }
  .btn-danger-solid { background: var(--danger); color: #fff; }
</style>
</head>
<body>
  <header class="top">
    <h1>⚽ Turniergenerator</h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <div class="wrap">
    <div id="app"></div>
    <footer class="foot">Läuft komplett offline · Daten werden lokal auf diesem Gerät gespeichert</footer>
  </div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "fussball_turnier_v1";
  var MAX_TEAMS = 8;

  // ---------- State ----------
  var state = null;

  function defaultState() {
    return {
      version: 1,
      phase: "setup",          // 'setup' | 'matches' | 'finished'
      name: "",
      teams: [],               // [{ id, name }]
      matches: [],             // [{ id, round, homeId, awayId, homeGoals, awayGoals }]
      settings: { pointsWin: 3, pointsDraw: 1 }
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return defaultState();
      var s = defaultState();
      // flach zusammenführen, damit fehlende Felder Defaults bekommen
      s.phase = parsed.phase || "setup";
      s.name = typeof parsed.name === "string" ? parsed.name : "";
      s.teams = Array.isArray(parsed.teams) ? parsed.teams : [];
      s.matches = Array.isArray(parsed.matches) ? parsed.matches : [];
      if (parsed.settings) {
        s.settings.pointsWin = num(parsed.settings.pointsWin, 3);
        s.settings.pointsDraw = num(parsed.settings.pointsDraw, 1);
      }
      return s;
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* Speicher voll / nicht verfügbar – ignorieren */ }
  }

  function resetState() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    state = defaultState();
    render();
  }

  // ---------- Helpers ----------
  function num(v, fallback) {
    var n = parseInt(v, 10);
    return isNaN(n) ? fallback : n;
  }
  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  var idCounter = 0;
  function newId(prefix) {
    idCounter += 1;
    return prefix + "_" + idCounter + "_" + (state ? state.teams.length + state.matches.length : 0);
  }
  function teamById(id) {
    for (var i = 0; i < state.teams.length; i++) if (state.teams[i].id === id) return state.teams[i];
    return null;
  }
  function teamName(id) {
    var t = teamById(id);
    return t ? t.name : "?";
  }

  // ---------- Spielplan: Round-Robin (Kreis-Verfahren) ----------
  function generateSchedule(teamIds) {
    var ids = teamIds.slice();
    if (ids.length % 2 !== 0) ids.push(null); // Dummy = "spielfrei"
    var n = ids.length;
    var rounds = n - 1;
    var half = n / 2;
    var arr = ids.slice();
    var matches = [];
    var mid = 0;
    for (var r = 0; r < rounds; r++) {
      for (var i = 0; i < half; i++) {
        var a = arr[i];
        var b = arr[n - 1 - i];
        if (a !== null && b !== null) {
          var home = a, away = b;
          if (r % 2 === 1) { home = b; away = a; } // Heimrecht abwechseln
          matches.push({
            id: "m_" + (mid++),
            round: r + 1,
            homeId: home,
            awayId: away,
            homeGoals: null,
            awayGoals: null
          });
        }
      }
      // rotieren: erstes Element fest, Rest im Kreis drehen
      var fixed = arr[0];
      var rest = arr.slice(1);
      rest.unshift(rest.pop());
      arr = [fixed].concat(rest);
    }
    return matches;
  }

  // ---------- Tabelle berechnen ----------
  function computeStandings() {
    var stats = {};
    state.teams.forEach(function (t) {
      stats[t.id] = { id: t.id, name: t.name, sp: 0, s: 0, u: 0, n: 0, gf: 0, ga: 0, diff: 0, pts: 0 };
    });
    state.matches.forEach(function (m) {
      if (m.homeGoals == null || m.awayGoals == null) return;
      var h = stats[m.homeId], a = stats[m.awayId];
      if (!h || !a) return;
      var hg = m.homeGoals, ag = m.awayGoals;
      h.sp++; a.sp++;
      h.gf += hg; h.ga += ag;
      a.gf += ag; a.ga += hg;
      if (hg > ag) { h.s++; a.n++; }
      else if (hg < ag) { a.s++; h.n++; }
      else { h.u++; a.u++; }
    });
    var rows = [];
    Object.keys(stats).forEach(function (k) {
      var st = stats[k];
      st.diff = st.gf - st.ga;
      st.pts = st.s * state.settings.pointsWin + st.u * state.settings.pointsDraw;
      rows.push(st);
    });
    rows.sort(function (x, y) {
      return (y.pts - x.pts)
        || (y.diff - x.diff)
        || (y.gf - x.gf)
        || x.name.localeCompare(y.name, "de");
    });
    return rows;
  }

  function playedCount() {
    var c = 0;
    state.matches.forEach(function (m) {
      if (m.homeGoals != null && m.awayGoals != null) c++;
    });
    return c;
  }

  // Eigenes Bestätigungsfenster – funktioniert auch in In-App-Browsern (z. B. Documents),
  // die window.confirm() unterdrücken.
  function showConfirm(message, onYes, opts) {
    opts = opts || {};
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modal">' +
        '<div class="modal-msg"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-secondary" data-act="no">' + esc(opts.cancelText || "Abbrechen") + '</button>' +
          '<button class="' + (opts.danger ? "btn-danger-solid" : "btn-primary") + '" data-act="yes">' + esc(opts.okText || "OK") + '</button>' +
        '</div>' +
      '</div>';
    overlay.querySelector(".modal-msg").textContent = message;
    function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    overlay.querySelector('[data-act="no"]').addEventListener("click", close);
    overlay.querySelector('[data-act="yes"]').addEventListener("click", function () { close(); onYes(); });
    document.body.appendChild(overlay);
  }

  // ---------- Render ----------
  var app = document.getElementById("app");
  var subtitle = document.getElementById("subtitle");

  function render() {
    if (state.phase === "matches") renderMatches();
    else if (state.phase === "finished") renderFinished();
    else renderSetup();
    setSubtitle();
    window.scrollTo(0, 0);
  }

  function setSubtitle() {
    if (state.phase === "setup") subtitle.textContent = "Jeder gegen jeden";
    else subtitle.textContent = state.name ? state.name : "Jeder gegen jeden";
  }

  // ----- SETUP -----
  function renderSetup() {
    var teamsHtml = "";
    if (state.teams.length === 0) {
      teamsHtml = '<div class="empty">Noch keine Teams – oben eintragen und hinzufügen.</div>';
    } else {
      state.teams.forEach(function (t, i) {
        teamsHtml +=
          '<div class="team-row">' +
            '<div class="idx">' + (i + 1) + '</div>' +
            '<input type="text" data-edit="' + esc(t.id) + '" value="' + esc(t.name) + '" maxlength="24" />' +
            '<button class="icon-btn" data-del="' + esc(t.id) + '" aria-label="Team entfernen">🗑</button>' +
          '</div>';
      });
    }

    var canAdd = state.teams.length < MAX_TEAMS;
    var canStart = state.teams.length >= 2;

    app.innerHTML =
      '<div class="card">' +
        '<h2>🏆 Turnier einrichten</h2>' +
        '<label class="fld">Turniername (optional)</label>' +
        '<input type="text" id="tname" value="' + esc(state.name) + '" maxlength="40" placeholder="z. B. Sommer-Cup 2026" />' +
      '</div>' +

      '<div class="card">' +
        '<h2>👥 Teams <span class="hint">' + state.teams.length + ' / ' + MAX_TEAMS + '</span></h2>' +
        '<div class="row">' +
          '<input type="text" id="newteam" maxlength="24" placeholder="Teamname eingeben" ' + (canAdd ? '' : 'disabled') + ' />' +
          '<button class="btn-add" id="addBtn" ' + (canAdd ? '' : 'disabled') + '>+ Hinzufügen</button>' +
        '</div>' +
        (canAdd ? '' : '<div class="note">Maximal ' + MAX_TEAMS + ' Teams.</div>') +
        '<div id="teamList">' + teamsHtml + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<h2>▶️ Los geht\'s</h2>' +
        '<div class="note" style="margin-top:0;text-align:left">' +
          'Modus: <b>Jeder gegen jeden</b> · Sieg ' + state.settings.pointsWin +
          ' Pkt, Unentschieden ' + state.settings.pointsDraw + ' Pkt.' +
          (canStart ? '' : '<br>Mindestens 2 Teams nötig.') +
        '</div>' +
        '<div class="spacer"></div>' +
        '<button class="btn-primary" id="startBtn" ' + (canStart ? '' : 'disabled') + '>Turnier starten ⚽</button>' +
      '</div>';

    // Events
    var tname = document.getElementById("tname");
    tname.addEventListener("input", function () { state.name = tname.value; saveState(); setSubtitle(); });

    var newteam = document.getElementById("newteam");
    var addBtn = document.getElementById("addBtn");

    function addTeam() {
      var name = newteam.value.trim();
      if (!name) { newteam.focus(); return; }
      if (state.teams.length >= MAX_TEAMS) return;
      state.teams.push({ id: newId("t"), name: name });
      saveState();
      renderSetup();
      var again = document.getElementById("newteam");
      if (again) again.focus();
    }
    if (addBtn) addBtn.addEventListener("click", addTeam);
    if (newteam) newteam.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); addTeam(); }
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-edit]"), function (inp) {
      inp.addEventListener("input", function () {
        var t = teamById(inp.getAttribute("data-edit"));
        if (t) { t.name = inp.value; saveState(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del");
        state.teams = state.teams.filter(function (t) { return t.id !== id; });
        saveState();
        renderSetup();
      });
    });

    var startBtn = document.getElementById("startBtn");
    if (startBtn) startBtn.addEventListener("click", startTournament);
  }

  function startTournament() {
    // leere Namen automatisch benennen, damit nichts leer bleibt
    state.teams.forEach(function (t, i) {
      if (!t.name || !t.name.trim()) t.name = "Team " + (i + 1);
    });
    if (state.teams.length < 2) return;
    state.matches = generateSchedule(state.teams.map(function (t) { return t.id; }));
    state.phase = "matches";
    saveState();
    render();
  }

  // ----- MATCHES -----
  function renderMatches() {
    var total = state.matches.length;

    // nach Spieltag gruppieren
    var byRound = {};
    state.matches.forEach(function (m) {
      (byRound[m.round] = byRound[m.round] || []).push(m);
    });
    var rounds = Object.keys(byRound).map(Number).sort(function (a, b) { return a - b; });

    var matchesHtml = "";
    rounds.forEach(function (r) {
      matchesHtml += '<div class="matchday-title">Spieltag ' + r + '</div>';
      byRound[r].forEach(function (m) {
        matchesHtml +=
          '<div class="match" data-mid="' + esc(m.id) + '">' +
            '<div class="tname home">' + esc(teamName(m.homeId)) + '</div>' +
            '<div class="score">' +
              '<input type="number" inputmode="numeric" min="0" max="99" data-mid="' + esc(m.id) + '" data-side="home" value="' + (m.homeGoals == null ? "" : m.homeGoals) + '" />' +
              '<span class="colon">:</span>' +
              '<input type="number" inputmode="numeric" min="0" max="99" data-mid="' + esc(m.id) + '" data-side="away" value="' + (m.awayGoals == null ? "" : m.awayGoals) + '" />' +
            '</div>' +
            '<div class="tname away">' + esc(teamName(m.awayId)) + '</div>' +
          '</div>';
      });
    });

    app.innerHTML =
      '<div class="card">' +
        '<h2>⚽ Spiele <span class="hint" id="progress"></span></h2>' +
        matchesHtml +
      '</div>' +

      '<div class="card">' +
        '<h2>📊 Tabelle</h2>' +
        '<div class="table-scroll">' + standingsTableHtml(false) + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="actions">' +
          '<button class="btn-secondary" id="backBtn">↩︎ Teams ändern</button>' +
          '<button class="btn-primary" id="finishBtn">Turnier beenden 🏁</button>' +
        '</div>' +
        '<div class="note">„Teams ändern" behält deine Ergebnisse, wenn du die Teamliste gleich lässt.</div>' +
      '</div>';

    // Score-Eingaben
    Array.prototype.forEach.call(document.querySelectorAll('input[data-side]'), function (inp) {
      inp.addEventListener("input", function () {
        var m = matchById(inp.getAttribute("data-mid"));
        if (!m) return;
        var raw = inp.value;
        var val = raw === "" ? null : Math.max(0, Math.min(99, num(raw, 0)));
        if (inp.getAttribute("data-side") === "home") m.homeGoals = val;
        else m.awayGoals = val;
        saveState();
        refreshLive();
      });
    });

    document.getElementById("finishBtn").addEventListener("click", finishTournament);
    document.getElementById("backBtn").addEventListener("click", function () {
      state.phase = "setup";
      saveState();
      render();
    });

    refreshLive();
  }

  function matchById(id) {
    for (var i = 0; i < state.matches.length; i++) if (state.matches[i].id === id) return state.matches[i];
    return null;
  }

  // aktualisiert nur Tabelle, Fortschritt und Sieger-Hervorhebung (ohne Neu-Rendern der Eingaben)
  function refreshLive() {
    var prog = document.getElementById("progress");
    if (prog) prog.textContent = playedCount() + " / " + state.matches.length + " Spiele";

    // Sieger je Spiel farblich markieren
    Array.prototype.forEach.call(document.querySelectorAll('.match'), function (row) {
      var m = matchById(row.getAttribute("data-mid"));
      if (!m) return;
      var inputs = row.querySelectorAll('input[data-side]');
      var hi = inputs[0], ai = inputs[1];
      hi.classList.remove("win"); ai.classList.remove("win");
      if (m.homeGoals != null && m.awayGoals != null) {
        if (m.homeGoals > m.awayGoals) hi.classList.add("win");
        else if (m.awayGoals > m.homeGoals) ai.classList.add("win");
      }
    });

    // Tabelle neu aufbauen
    var scroll = document.querySelector(".table-scroll");
    if (scroll) scroll.innerHTML = standingsTableHtml(false);
  }

  function standingsTableHtml(showMedals) {
    var rows = computeStandings();
    var html =
      '<table class="standings"><thead><tr>' +
        '<th class="rank">#</th><th style="text-align:left">Team</th>' +
        '<th>Sp</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>Diff</th><th>Pkt</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function (st, i) {
      var rank = i + 1;
      var cls = rank <= 3 ? "r" + rank : "";
      var medal = "";
      if (showMedals) medal = rank === 1 ? "🥇 " : rank === 2 ? "🥈 " : rank === 3 ? "🥉 " : "";
      var diffStr = (st.diff > 0 ? "+" : "") + st.diff;
      html +=
        '<tr class="' + cls + '">' +
          '<td class="rank">' + rank + '</td>' +
          '<td class="team-cell">' + medal + esc(st.name) + '</td>' +
          '<td>' + st.sp + '</td>' +
          '<td>' + st.s + '</td>' +
          '<td>' + st.u + '</td>' +
          '<td>' + st.n + '</td>' +
          '<td>' + st.gf + ':' + st.ga + '</td>' +
          '<td>' + diffStr + '</td>' +
          '<td class="pts">' + st.pts + '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function finishTournament() {
    var missing = state.matches.length - playedCount();
    function doFinish() {
      state.phase = "finished";
      saveState();
      render();
    }
    if (missing > 0) {
      showConfirm(
        "Es " + (missing === 1 ? "ist" : "sind") + " noch " + missing + " Spiel" +
        (missing === 1 ? "" : "e") + " ohne Ergebnis.\n\nTrotzdem beenden und Platzierungen berechnen?",
        doFinish,
        { okText: "Beenden", cancelText: "Zurück" }
      );
    } else {
      doFinish();
    }
  }

  // ----- FINISHED -----
  function renderFinished() {
    var rows = computeStandings();
    var first = rows[0], second = rows[1], third = rows[2];

    var championHtml =
      '<div class="champion">' +
        '<div class="cup">🏆</div>' +
        '<div class="label">Turniersieger</div>' +
        '<div class="name">' + (first ? esc(first.name) : "–") + '</div>' +
        (first ? '<div class="note" style="color:#8a6d1a;margin-top:6px">' +
          first.pts + ' Punkte · ' + first.gf + ':' + first.ga + ' Tore</div>' : '') +
      '</div>';

    var podiumHtml =
      '<div class="podium">' +
        '<div class="spot p2">' +
          '<div class="medal">🥈</div>' +
          '<div class="pteam">' + (second ? esc(second.name) : "–") + '</div>' +
          '<div class="bar">2</div>' +
        '</div>' +
        '<div class="spot p1">' +
          '<div class="medal">🥇</div>' +
          '<div class="pteam">' + (first ? esc(first.name) : "–") + '</div>' +
          '<div class="bar">1</div>' +
        '</div>' +
        '<div class="spot p3">' +
          '<div class="medal">🥉</div>' +
          '<div class="pteam">' + (third ? esc(third.name) : "–") + '</div>' +
          '<div class="bar">3</div>' +
        '</div>' +
      '</div>';

    app.innerHTML =
      '<div class="card">' + championHtml + (rows.length >= 2 ? podiumHtml : '') + '</div>' +

      '<div class="card">' +
        '<h2>📋 Endtabelle</h2>' +
        '<div class="table-scroll">' + standingsTableHtml(true) + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="actions">' +
          '<button class="btn-secondary" id="editBtn">↩︎ Ergebnisse ändern</button>' +
          '<button class="btn-danger" id="newBtn">🆕 Neues Turnier</button>' +
        '</div>' +
      '</div>';

    document.getElementById("editBtn").addEventListener("click", function () {
      state.phase = "matches";
      saveState();
      render();
    });
    document.getElementById("newBtn").addEventListener("click", function () {
      showConfirm(
        "Neues Turnier starten?\n\nDas aktuelle Turnier wird komplett gelöscht.",
        resetState,
        { okText: "Löschen & neu", cancelText: "Abbrechen", danger: true }
      );
    });
  }

  // ---------- Start ----------
  state = loadState();
  render();
})();
</script>
</body>
</html>
